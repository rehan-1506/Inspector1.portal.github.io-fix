<div class="joke-widget" id="jokeWidget" aria-live="polite">
  <h3 class="joke-title">Random Joke</h3>

  <div class="joke-card">
    <p id="jokeText" class="joke-text">Press <strong>Tell me a joke</strong> to get one!</p>
    <div class="joke-meta" id="jokeMeta" aria-hidden="true"></div>
  </div>

  <div class="joke-actions">
    <button id="newJoke" class="btn btn-primary" type="button">Tell me a joke</button>
    <button id="copyJoke" class="btn" type="button" title="Copy joke to clipboard">Copy</button>
    <a id="tweetJoke" class="btn btn-outline" target="_blank" rel="noopener noreferrer" title="Tweet this joke">Tweet</a>
  </div>

  <!-- Include CSS and JS -->
  <link rel="stylesheet" href="joke.css">
  <script src="joke.js" defer></script>
</div>
